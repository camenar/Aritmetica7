<!DOCTYPE html>

<head>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fredoka@5.0.3/index.css">

<style>
  body { font-family: 'Quicksand', sans-serif; background: linear-gradient(135deg, #3d1f0f 0%, #6b3410 50%, #8b4513 100%); min-height: 100vh; }
  .title-font { font-family: 'Fredoka', sans-serif; }
  .card { background: rgba(255, 250, 240, 0.97); backdrop-filter: blur(10px); }
  .brownie-gradient { background: linear-gradient(135deg, #6b3410, #3d1f0f); }
  .input-ans { transition: all 0.3s; }
  .input-ans:focus { transform: scale(1.02); box-shadow: 0 0 0 3px rgba(139, 69, 19, 0.3); }
  .correct { background: #d1fae5 !important; border-color: #10b981 !important; }
  .incorrect { background: #fee2e2 !important; border-color: #ef4444 !important; }
  .phase-card { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
  .phase-card.locked { opacity: 0.5; filter: grayscale(0.6); pointer-events: none; }
  .phase-card.active { transform: scale(1.01); box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
  .fade-in { animation: fadeIn 0.6s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .brownie-icon { display: inline-block; animation: bounce 2s infinite; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .progress-fill { transition: width 0.8s ease-in-out; }
  .hint-box { background: linear-gradient(135deg, #fef3c7, #fde68a); border-left: 4px solid #f59e0b; }
  .solution-box { background: linear-gradient(135deg, #dbeafe, #bfdbfe); border-left: 4px solid #3b82f6; }
  .sparkle { animation: sparkle 1.5s infinite; }
  @keyframes sparkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  .fraction { display: inline-block; text-align: center; vertical-align: middle; }
  .fraction .num { display: block; border-bottom: 2px solid currentColor; padding: 0 4px; }
  .fraction .den { display: block; padding: 0 4px; }
  .situation-badge { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #3d1f0f; }
  .score-badge { background: linear-gradient(135deg, #10b981, #059669); color: white; }
  .penalty-badge { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; }
  .template-badge { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: white; }
  .hint-revealed { animation: hintPulse 0.5s ease-out; }
  @keyframes hintPulse { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .option-a { background: linear-gradient(135deg, #dbeafe, #bfdbfe); border-left: 4px solid #3b82f6; }
  .option-b { background: linear-gradient(135deg, #fce7f3, #fbcfe8); border-left: 4px solid #ec4899; }
</style>
</head>
<body class="p-4 md:p-8">

<div class="max-w-5xl mx-auto">

  <header class="card rounded-3xl p-6 md:p-8 mb-6 shadow-2xl border-4 border-amber-900">
    <div class="flex items-center justify-between flex-wrap gap-4">
      <div>
        <h1 class="title-font text-3xl md:text-5xl text-amber-900 font-bold">
          <span class="brownie-icon">🍫</span> Desafío de Repostería Matemática
        </h1>
        <p class="text-amber-700 mt-2 text-lg">Fracciones, escalado y negocios — ¡situaciones únicas para cada estudiante!</p>
      </div>
      <div class="text-right">
        <div class="text-sm text-amber-700 font-semibold">PROGRESO</div>
        <div class="text-3xl title-font text-amber-900" id="progressText">0 / 0</div>
      </div>
    </div>
    <div class="mt-6 bg-amber-100 rounded-full h-4 overflow-hidden border-2 border-amber-900">
      <div id="progressBar" class="progress-fill h-full brownie-gradient" style="width: 0%"></div>
    </div>
    <div class="flex gap-3 flex-wrap mt-4">

      <div id="templateBadge" class="hidden"><span class="template-badge inline-block px-4 py-2 rounded-full font-bold text-sm"></span></div>
      <div id="scoreBadge" class="hidden"><span class="score-badge inline-block px-4 py-2 rounded-full font-bold text-sm">⭐ Puntaje: 0.0 / 5.0</span></div>
    </div>
  </header>

  <section id="situation" class="card rounded-3xl p-6 md:p-8 mb-6 shadow-xl border-2 border-amber-800 fade-in">
    <h2 class="title-font text-2xl md:text-3xl text-amber-900 font-bold mb-4">📖 La Situación</h2>
    <div id="situationContent" class="text-gray-800 leading-relaxed space-y-3"></div>
  </section>

  <div id="phasesContainer" class="space-y-6"></div>
  <div id="finalSection" class="hidden"></div>

</div>

<script>
// ============ BANCO DE DATOS ============
const NAMES = ["Sofía", "Mateo", "Valentina", "Diego", "Camila", "Andrés", "Luciana", "Sebastián", "Isabella", "Santiago", "Mariana", "Emiliano", "Gabriela", "Nicolás", "Paula", "Alejandro", "Daniela", "Tomás", "Renata", "Felipe", "Catalina", "Joaquín", "Victoria", "Samuel"];

const DESSERTS = [
  { name: "brownies de chocolate con nueces", short: "brownies", emoji: "🍫" },
  { name: "galletas de avena con pasas", short: "galletas", emoji: "🍪" },
  { name: "panqués de vainilla", short: "panqués", emoji: "🍰" },
  { name: "magdalenas de limón", short: "magdalenas", emoji: "🧁" },
  { name: "tarta de manzana", short: "tartas", emoji: "🥧" },
  { name: "cupcakes de fresa", short: "cupcakes", emoji: "🧁" },
  { name: "barritas de dátiles y almendra", short: "barritas", emoji: "🍫" },
  { name: "rollos de canela", short: "rollos", emoji: "🥐" },
  { name: "alfajores de dulce de leche", short: "alfajores", emoji: "🍪" },
  { name: "tortitas de chocolate", short: "tortitas", emoji: "🥞" },
  { name: "budín de zanahoria", short: "budín", emoji: "🥕" },
  { name: "cheesecake de frutos rojos", short: "cheesecakes", emoji: "🍰" }
];

const INGREDIENTS_POOL = [
  { name: "Harina", emoji: "🌾" }, { name: "Azúcar", emoji: "🍬" },
  { name: "Azúcar morena", emoji: "🍯" }, { name: "Cacao en polvo", emoji: "🍫" },
  { name: "Mantequilla", emoji: "🧈" }, { name: "Avena", emoji: "🌾" },
  { name: "Leche", emoji: "🥛" }, { name: "Crema", emoji: "🍦" },
  { name: "Huevos (tazas)", emoji: "🥚" }, { name: "Pasas", emoji: "🍇" },
  { name: "Nueces", emoji: "🥜" }, { name: "Almendras", emoji: "🌰" },
  { name: "Manzanas (tazas)", emoji: "🍎" }, { name: "Fresas (tazas)", emoji: "🍓" },
  { name: "Miel", emoji: "🍯" }, { name: "Chocolate picado", emoji: "🍫" },
  { name: "Queso crema", emoji: "🧀" }, { name: "Maicena", emoji: "🌽" }
];

const REASONS = [
  "se desata una fuerte tormenta y varios amigos cancelan",
  "su equipo de fútbol cancela el partido y solo algunos compañeros pueden ir",
  "su hermana cumple años y quiere llevar una porción justa para cada invitado",
  "su familia se reduce porque algunos primos viajaron fuera de la ciudad",
  "el colegio cambió la fecha de la fiesta y solo asistirán algunos compañeros",
  "varios invitados tuvieron que trabajar ese día",
  "algunos amigos se fueron de vacaciones de última hora",
  "la reunión se hizo más pequeña porque llovió todo el día",
  "solo pudo confirmar asistencia la mitad del grupo original",
  "decidió hacer una reunión más íntima con sus mejores amigos"
];

// ============ UTILIDADES ============
function gcd(a, b) { return b === 0 ? Math.abs(a) : gcd(b, a % b); }
function simplify(n, d) {
  if (d === 0) return [n, d];
  const g = gcd(Math.abs(n), Math.abs(d));
  if (d < 0) { n = -n; d = -d; }
  return [n / g, d / g];
}
function fractionHTML(n, d) {
  return `<span class="fraction"><span class="num">${n}</span><span class="den">${d}</span></span>`;
}
function formatMoney(v) { return `$${v.toFixed(2)}`; }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function hashCode(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return hash;
}

// ============ GENERADOR BASE ============
function generateBaseSituation() {
  const name = pick(NAMES);
  const dessert = pick(DESSERTS);
  const reason = pick(REASONS);
  const servingPairs = [
    [12, 8], [12, 6], [12, 9], [12, 4],
    [15, 10], [15, 5], [15, 6],
    [18, 12], [18, 6], [18, 9],
    [20, 15], [20, 10], [20, 8], [20, 5],
    [24, 16], [24, 18], [24, 8], [24, 12],
    [30, 20], [30, 15], [30, 10]
  ];
  const [origServ, newServ] = pick(servingPairs);
  const [scaleN, scaleD] = simplify(newServ, origServ);
  const priceOptions = [1.50, 2.00, 2.50, 3.00, 3.50, 4.00, 4.50, 5.00];
  const pricePerUnit = pick(priceOptions);
  const storyExtra = `El día que iba a hornear, ${reason}. Al final, ${name} confirma que solo vendrán ${newServ} personas. Como no quiere que sobre comida ni desperdiciar ingredientes, decide ajustar (escalar) la receta para preparar exactamente ${newServ} porciones.`;
  return {
    name, dessert: dessert.name, dessertShort: dessert.short, dessertEmoji: dessert.emoji,
    originalServings: origServ, newServings: newServ,
    pricePerUnit, reason, storyExtra, scaleN, scaleD
  };
}

function generateIngredients(count, scaleN, scaleD) {
  const ingredients = shuffle(INGREDIENTS_POOL).slice(0, count);
  const fractionOptions = [
    [1, 2], [1, 3], [1, 4], [2, 3], [3, 4],
    [1, 5], [2, 5], [3, 5], [4, 5],
    [1, 6], [5, 6], [1, 8], [3, 8], [5, 8], [7, 8]
  ];
  const pricePerCupOptions = [3, 4, 5, 6, 7, 8, 9, 10, 12, 15];
  ingredients.forEach(ing => {
    ing.amount = pick(fractionOptions);
    ing.pricePerCup = pick(pricePerCupOptions);
  });
  const hasHardDen = ingredients.some(ing => {
    const [newN, newD] = simplify(ing.amount[0] * scaleN, ing.amount[1] * scaleD);
    return 12 % newD !== 0;
  });
  if (!hasHardDen) {
    const idx = Math.floor(Math.random() * count);
    ingredients[idx].amount = pick([[1, 5], [2, 5], [3, 5], [4, 5]]);
  }
  return ingredients;
}

// ============ PLANTILLAS ============
const TEMPLATES = {
  A: { name: "Completa", icon: "🅰️", description: "Escalado + costos + negocio + pensamiento crítico", questions: 8 },
  B: { name: "Solo escalado", icon: "🅱️", description: "Fracciones y proporciones puras", questions: 3 },
  C: { name: "Escalado + costos", icon: "🅲️", description: "Producción sin análisis de negocio", questions: 5 },
  D: { name: "Negocio directo", icon: "🅳️", description: "Ingresos y ganancias sin desglose", questions: 5 },
  E: { name: "Escalado inverso", icon: "🅴️", description: "De la receta nueva a la original", questions: 4 },
  F: { name: "Comparativa", icon: "🅵️", description: "Dos recetas, ¿cuál conviene más?", questions: 6 }
};

function generateSituation() {
  const templateKey = pick(Object.keys(TEMPLATES));
  const template = TEMPLATES[templateKey];
  const base = generateBaseSituation();
  let situation = { ...base, template: templateKey, templateName: template.name };
  if (templateKey === 'F') {
    const dessert2 = pick(DESSERTS.filter(d => d.name !== base.dessert));
    situation.dessert2 = dessert2.name;
    situation.dessertShort2 = dessert2.short;
    situation.dessertEmoji2 = dessert2.emoji;
    situation.ingredients = generateIngredients(3, base.scaleN, base.scaleD);
    situation.ingredients2 = generateIngredients(3, base.scaleN, base.scaleD);
  } else {
    const ingCount = templateKey === 'B' ? 2 : (templateKey === 'E' ? 3 : 4);
    situation.ingredients = generateIngredients(ingCount, base.scaleN, base.scaleD);
  }
  return situation;
}

let currentSituation = generateSituation();
let completedPhases = new Set();
let phaseScores = {};

// ============ SITUATION RENDER ============
function renderSituation() {
  const s = currentSituation;
  const template = TEMPLATES[s.template];
  let content = '';

  if (s.template === 'F') {
    const ingList1 = s.ingredients.map(i => `<li><strong>${i.emoji} ${i.name}:</strong> ${fractionHTML(i.amount[0], i.amount[1])} de taza (${formatMoney(i.pricePerCup)}/taza)</li>`).join('');
    const ingList2 = s.ingredients2.map(i => `<li><strong>${i.emoji} ${i.name}:</strong> ${fractionHTML(i.amount[0], i.amount[1])} de taza (${formatMoney(i.pricePerCup)}/taza)</li>`).join('');
    content = `
      <p><strong>${s.name}</strong> quiere preparar postres para su reunión de ${s.newServings} personas. Tiene dos recetas en mente y no sabe cuál elegir:</p>
      <div class="option-a rounded-xl p-4 my-3">
        <h4 class="font-bold text-blue-900 mb-2">🅰️ Opción A: ${s.dessert}</h4>
        <p class="text-sm text-gray-700 mb-2">Receta original para ${s.originalServings} porciones:</p>
        <ul class="list-none pl-4 space-y-1 text-sm">${ingList1}</ul>
      </div>
      <div class="option-b rounded-xl p-4 my-3">
        <h4 class="font-bold text-pink-900 mb-2">🅱️ Opción B: ${s.dessert2}</h4>
        <p class="text-sm text-gray-700 mb-2">Receta original para ${s.originalServings} porciones:</p>
        <ul class="list-none pl-4 space-y-1 text-sm">${ingList2}</ul>
      </div>
      <p class="mt-3"><strong>🌪️ El giro:</strong> ${s.storyExtra}</p>
      <p><strong>💰 ${s.name}</strong> venderá cada porción a <strong>${formatMoney(s.pricePerUnit)}</strong>. ¿Cuál receta le da MAYOR ganancia?</p>
    `;
  } else {
    const ingList = s.ingredients.map(i => `<li><strong>${i.emoji} ${i.name}:</strong> ${fractionHTML(i.amount[0], i.amount[1])} de taza (${formatMoney(i.pricePerCup)}/taza)</li>`).join('');
    if (s.template === 'E') {
      content = `
        <p><strong>${s.name}</strong> ya preparó su receta ajustada para ${s.newServings} personas, pero olvidó las cantidades originales de la receta de su abuela.</p>
        <p>Los ingredientes que usó en la receta ajustada son:</p>
        <ul class="list-none pl-4 space-y-1">${ingList}</ul>
        <p class="mt-3"><strong>🔍 Tu misión:</strong> Ayudar a ${s.name} a descubrir las cantidades de la receta original, que rendía ${s.originalServings} porciones.</p>
      `;
    } else {
      content = `
        <p><strong>${s.name}</strong> quiere preparar su famosa receta de <em>${s.dessert}</em>. La receta original está diseñada para rendir exactamente <strong>${s.originalServings} porciones</strong>.</p>
        <p>Los ingredientes originales son:</p>
        <ul class="list-none pl-4 space-y-1">${ingList}</ul>
        <p class="mt-3"><strong>🌪️ El giro:</strong> ${s.storyExtra}</p>
      `;
      if (s.template !== 'B') {
        content += `<p>Además, <strong>${s.name}</strong> venderá cada porción a <strong>${formatMoney(s.pricePerUnit)}</strong> para recuperar su inversión.</p>`;
      }
    }
  }

  document.getElementById('situationContent').innerHTML = content;
  const badge = document.getElementById('situationBadge');
  badge.classList.remove('hidden');
  const seed = `${s.name}-${s.originalServings}-${s.newServings}-${s.template}`;
  const shortId = Math.abs(hashCode(seed)).toString(36).toUpperCase().slice(0, 6);
  badge.querySelector('span').textContent = `🎲 Situación #${shortId}`;
  const templateBadge = document.getElementById('templateBadge');
  templateBadge.classList.remove('hidden');
  templateBadge.querySelector('span').textContent = `${template.icon} ${template.name}`;
}

// ============ VALIDADORES COMUNES ============
function validateFraction(inputN, inputD, expectedN, expectedD) {
  const n = parseInt(inputN);
  const d = parseInt(inputD);
  if (isNaN(n) || isNaN(d) || d === 0) return { ok: false, msg: "Ingresa valores válidos." };
  const [sn, sd] = simplify(n, d);
  const [en, ed] = simplify(expectedN, expectedD);
  if (sn === en && sd === ed) return { ok: true, msg: `¡Correcto! ${en}/${ed}.` };
  return { ok: false, msg: `La respuesta es ${en}/${ed}.` };
}

function validateMoney(input, expected, tolerance = 0.05) {
  const val = parseFloat(input);
  if (isNaN(val)) return { ok: false, msg: "Ingresa un valor numérico." };
  if (Math.abs(val - expected) > tolerance) return { ok: false, msg: `La respuesta es ${formatMoney(expected)}.` };
  return { ok: true, msg: `¡Correcto! ${formatMoney(expected)}.` };
}

function validateIngredient(input, ingredients, scaleN, scaleD) {
  const val = input.trim().toLowerCase();
  let hardest = null;
  for (let i = 0; i < ingredients.length; i++) {
    const [origN, origD] = ingredients[i].amount;
    const [rn, rd] = simplify(origN * scaleN, origD * scaleD);
    if (12 % rd !== 0) { hardest = ingredients[i].name; break; }
  }
  if (!hardest) {
    let maxDen = 0;
    for (let i = 0; i < ingredients.length; i++) {
      const [origN, origD] = ingredients[i].amount;
      const [rn, rd] = simplify(origN * scaleN, origD * scaleD);
      if (rd > maxDen) { maxDen = rd; hardest = ingredients[i].name; }
    }
  }
  const match = hardest.toLowerCase().split(' ').some(w => w.length > 2 && val.includes(w)) || val.includes(hardest.toLowerCase());
  if (match) return { ok: true, msg: `¡Correcto! ${hardest} es el más difícil.` };
  return { ok: false, msg: `La respuesta es: ${hardest}.` };
}

function calcTotalCost(ingredients, scaleN, scaleD) {
  let total = 0;
  for (let i = 0; i < ingredients.length; i++) {
    const [origN, origD] = ingredients[i].amount;
    total += ((origN * scaleN) / (origD * scaleD)) * ingredients[i].pricePerCup;
  }
  return total;
}

// ============ PHASES POR PLANTILLA ============
function buildPhases() {
  const s = currentSituation;
  const [scaleN, scaleD] = [s.scaleN, s.scaleD];
  switch(s.template) {
    case 'A': return buildTemplateA(s, scaleN, scaleD);
    case 'B': return buildTemplateB(s, scaleN, scaleD);
    case 'C': return buildTemplateC(s, scaleN, scaleD);
    case 'D': return buildTemplateD(s, scaleN, scaleD);
    case 'E': return buildTemplateE(s, scaleN, scaleD);
    case 'F': return buildTemplateF(s, scaleN, scaleD);
    default: return buildTemplateA(s, scaleN, scaleD);
  }
}

function buildTemplateA(s, scaleN, scaleD) {
  const totalCost = calcTotalCost(s.ingredients, scaleN, scaleD);
  const income = s.newServings * s.pricePerUnit;
  const profit = income - totalCost;
  return [
    { id: 1, title: "Fase 1: Escalando la Receta", subtitle: "Pregunta 1 de 8", icon: "📏",
      question: `¿Qué fracción de la receta original necesita preparar ${s.name} para las ${s.newServings} personas? (Simplifica al máximo)`,
      hint: `Divide ${s.newServings}/${s.originalServings} y simplifica dividiendo entre el MCD (${gcd(s.newServings, s.originalServings)}).`,
      inputs: [{ key: "q1_num", label: "Numerador", placeholder: "?" }, { key: "q1_den", label: "Denominador", placeholder: "?" }],
      validate: () => validateFraction(document.getElementById("q1_num").value, document.getElementById("q1_den").value, scaleN, scaleD)
    },
    { id: 2, title: "Fase 1: Escalando la Receta", subtitle: "Pregunta 2 de 8", icon: "🥣",
      question: `Calcula la nueva cantidad exacta para cada ingrediente multiplicando por ${scaleN}/${scaleD}.`,
      hint: `(a/b) × (c/d) = (a×c)/(b×d). Luego simplifica.`,
      inputs: s.ingredients.map((ing, idx) => ({ key: `q2_${idx}`, label: `${ing.emoji} ${ing.name} (num/den)`, placeholder: "num/den", isFraction: true })),
      validate: () => {
        for (let i = 0; i < s.ingredients.length; i++) {
          const val = document.getElementById(`q2_${i}`).value.trim();
          const parts = val.split('/').map(x => parseInt(x.trim()));
          if (parts.length !== 2 || isNaN(parts[0]) || isNaN(parts[1]) || parts[1] === 0) return { ok: false, msg: `Revisa el formato de ${s.ingredients[i].name}.` };
          const [origN, origD] = s.ingredients[i].amount;
          const r = validateFraction(parts[0], parts[1], origN * scaleN, origD * scaleD);
          if (!r.ok) return { ok: false, msg: `${s.ingredients[i].name}: ${r.msg}` };
        }
        return { ok: true, msg: `¡Excelente! Todas las cantidades son correctas.` };
      }
    },
    { id: 3, title: "Fase 2: Calculando los Costos", subtitle: "Pregunta 3 de 8", icon: "💵",
      question: `¿Cuánto gastará ${s.name} en cada ingrediente? (cantidad × precio por taza)`,
      hint: `Ejemplo: 1/2 taza × $6.00/taza = $3.00.`,
      inputs: s.ingredients.map((ing, idx) => ({ key: `q3_${idx}`, label: `${ing.emoji} ${ing.name} ($)`, placeholder: "0.00", isMoney: true })),
      validate: () => {
        for (let i = 0; i < s.ingredients.length; i++) {
          const [origN, origD] = s.ingredients[i].amount;

      validate: () => {

// ============ RENDER PHASES ============
let currentPhases = [];

function renderPhases() {
  currentPhases = buildPhases();
  const container = document.getElementById('phasesContainer');
  container.innerHTML = '';
  document.getElementById('progressText').textContent = `0 / ${currentPhases.length}`;

  currentPhases.forEach((phase, idx) => {
    const isFirst = idx === 0;
    const div = document.createElement('div');
    div.className = `phase-card card rounded-3xl p-6 md:p-8 shadow-xl border-2 border-amber-800 ${isFirst ? 'active' : 'locked'}`;
    div.id = `phase-${phase.id}`;

    const inputsHTML = phase.inputs.map(inp => {
      if (inp.isFraction) {
        return `<div class="flex items-center gap-2 flex-wrap">
          <label class="text-amber-900 font-semibold w-48">${inp.label}</label>
          <input type="number" class="input-ans border-2 border-amber-400 rounded-lg px-3 py-2 w-20 text-center" id="${inp.key}_n" placeholder="num">

          <input type="number" class="input-ans border-2 border-amber-400 rounded-lg px-3 py-2 w-20 text-center" id="${inp.key}_d" placeholder="den">
        </div>`;
      } else if (inp.isMoney) {
        return `<div class="flex items-center gap-2">
          <label class="text-amber-900 font-semibold w-48">${inp.label}</label>
          <span class="text-2xl text-amber-900">$</span>
          <input type="number" step="0.01" class="input-ans border-2 border-amber-400 rounded-lg px-3 py-2 w-32" id="${inp.key}" placeholder="${inp.placeholder}">
        </div>`;
      } else {
        return `<div class="flex items-center gap-2 flex-wrap">
          <label class="text-amber-900 font-semibold w-48">${inp.label}</label>
          <input type="text" class="input-ans border-2 border-amber-400 rounded-lg px-3 py-2 w-48" id="${inp.key}" placeholder="${inp.placeholder}">
        </div>`;
      }
    }).join('');

    div.innerHTML = `
      <div class="flex items-center gap-3 mb-4">
        <div class="text-4xl">${phase.icon}</div>
        <div>
          <div class="text-sm text-amber-700 font-semibold">${phase.subtitle}</div>
          <h3 class="title-font text-xl md:text-2xl text-amber-900 font-bold">${phase.title}</h3>
        </div>
        <div id="phase-score-${phase.id}" class="ml-auto hidden">
          <span class="inline-block px-3 py-1 rounded-full font-bold text-sm"></span>
        </div>
      </div>
      <div class="bg-amber-50 rounded-xl p-4 mb-4 border-2 border-amber-200">
        <p class="text-gray-800 leading-relaxed">${phase.question}</p>
      </div>
      <div class="space-y-3 mb-4">${inputsHTML}</div>
      <div class="flex gap-3 flex-wrap">
        <button onclick="checkPhase(${phase.id})" class="bg-amber-800 hover:bg-amber-900 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition transform hover:scale-105">
          ✓ Verificar respuesta
        </button>
      </div>
      <div id="feedback-${phase.id}" class="mt-4 hidden"></div>
    `;
    container.appendChild(div);
  });
}

// ============ INTERACTIONS ============
function checkPhase(phaseId) {
  const phase = currentPhases.find(p => p.id === phaseId);
  const result = phase.validate();
  const fb = document.getElementById(`feedback-${phaseId}`);
  fb.classList.remove('hidden');

  if (result.ok) {
    const usedHint = phaseScores[phaseId]?.usedHint || false;
    const score = usedHint ? 0.75 : 1.0;
    phaseScores[phaseId] = { score, usedHint };

    fb.className = 'mt-4 solution-box rounded-xl p-4 fade-in';
    const scoreBadge = usedHint 
      ? `<span class="penalty-badge inline-block px-3 py-1 rounded-full font-bold text-sm ml-2">+0.75 puntos (con pista)</span>`
      : `<span class="score-badge inline-block px-3 py-1 rounded-full font-bold text-sm ml-2">+1.0 punto</span>`;
    fb.innerHTML = `<p class="text-green-900 font-bold text-lg">✅ ¡Correcto! ${scoreBadge}</p><p class="text-blue-900 mt-2">${result.msg}</p>`;

    const phaseScoreEl = document.getElementById(`phase-score-${phase.id}`);
    const spanEl = phaseScoreEl.querySelector('span');
    if (usedHint) {
      spanEl.textContent = '+0.75 ⚠️';
      spanEl.className = 'penalty-badge inline-block px-3 py-1 rounded-full font-bold text-sm';
    } else {
      spanEl.textContent = '+1.0 ✓';
      spanEl.className = 'score-badge inline-block px-3 py-1 rounded-full font-bold text-sm';
    }
    phaseScoreEl.classList.remove('hidden');

    phase.inputs.forEach(inp => {
      if (inp.isFraction) {
        const n = document.getElementById(`${inp.key}_n`);
        const d = document.getElementById(`${inp.key}_d`);
        if (n) n.classList.add('correct');
        if (d) d.classList.add('correct');
      } else {
        const el = document.getElementById(inp.key);
        if (el) el.classList.add('correct');
      }
    });

    completedPhases.add(phaseId);
    updateProgress();
    updateScoreBadge();
    unlockNextPhase(phaseId);

    if (completedPhases.size === currentPhases.length) {
      setTimeout(showFinal, 800);
    }
  } else {
    if (!phaseScores[phaseId]) phaseScores[phaseId] = { score: 0, usedHint: false };
    phaseScores[phaseId].usedHint = true;

    fb.className = 'mt-4 rounded-xl p-4 fade-in';
    fb.style.background = 'linear-gradient(135deg, #fee2e2, #fecaca)';
    fb.style.borderLeft = '4px solid #ef4444';
    fb.innerHTML = `
      <p class="text-red-900 font-bold">❌ Aún no es correcto</p>
      <p class="text-red-800 mt-1">${result.msg}</p>
      <div class="hint-box rounded-xl p-4 mt-3 hint-revealed">
        <p class="text-sm text-amber-900"><strong>💡 Pista (penaliza -0.25 puntos):</strong> ${phase.hint}</p>
      </div>
    `;

    phase.inputs.forEach(inp => {
      if (inp.isFraction) {
        const n = document.getElementById(`${inp.key}_n`);
        const d = document.getElementById(`${inp.key}_d`);
        if (n) { n.classList.add('incorrect'); setTimeout(() => n.classList.remove('incorrect'), 1500); }
        if (d) { d.classList.add('incorrect'); setTimeout(() => d.classList.remove('incorrect'), 1500); }
      } else {
        const el = document.getElementById(inp.key);
        if (el) { el.classList.add('incorrect'); setTimeout(() => el.classList.remove('incorrect'), 1500); }
      }
    });
  }
}

function unlockNextPhase(currentId) {
  const idx = currentPhases.findIndex(p => p.id === currentId);
  if (idx >= 0 && idx < currentPhases.length - 1) {
    const nextPhase = currentPhases[idx + 1];
    const nextEl = document.getElementById(`phase-${nextPhase.id}`);
    nextEl.classList.remove('locked');
    nextEl.classList.add('active');
    setTimeout(() => nextEl.scrollIntoView({ behavior: 'smooth', block: "center" }), 400);
  }
}

function updateProgress() {
  const pct = (completedPhases.size / currentPhases.length) * 100;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${completedPhases.size} / ${currentPhases.length}`;
}

function updateScoreBadge() {
  const totalScore = Object.values(phaseScores).reduce((sum, p) => sum + p.score, 0);
  const scaledScore = (totalScore / currentPhases.length) * 5;
  const badge = document.getElementById('scoreBadge');
  badge.classList.remove('hidden');
  badge.querySelector('span').textContent = `⭐ Puntaje: ${scaledScore.toFixed(1)} / 5.0`;
}

// ============ FINAL ============
function showFinal() {
  const s = currentSituation;
  const template = TEMPLATES[s.template];
  const totalScore = Object.values(phaseScores).reduce((sum, p) => sum + p.score, 0);
  const scaledScore = (totalScore / currentPhases.length) * 5;
  const perfectCount = Object.values(phaseScores).filter(p => p.score === 1).length;
  const hintCount = Object.values(phaseScores).filter(p => p.score === 0.75).length;

  let gradeEmoji = "🏆", gradeMessage = "¡Excelente trabajo!";
  if (scaledScore >= 4.5) { gradeEmoji = "🌟"; gradeMessage = "¡Desempeño sobresaliente!"; }
  else if (scaledScore >= 3.5) { gradeEmoji = "👏"; gradeMessage = "¡Muy buen trabajo!"; }
  else if (scaledScore >= 2.5) { gradeEmoji = "👍"; gradeMessage = "¡Buen esfuerzo!"; }
  else if (scaledScore >= 1.5) { gradeEmoji = "📚"; gradeMessage = "Sigue practicando."; }
  else { gradeEmoji = "💪"; gradeMessage = "No te rindas, ¡tú puedes!"; }

  const finalSection = document.getElementById('finalSection');
  finalSection.classList.remove('hidden');
  finalSection.innerHTML = `
    <div class="card rounded-3xl p-6 md:p-8 shadow-2xl border-4 border-amber-900 fade-in">
      <div class="text-center mb-6">
        <div class="text-6xl mb-3 sparkle">${gradeEmoji}</div>
        <h2 class="title-font text-3xl md:text-4xl text-amber-900 font-bold">¡Desafío Completado!</h2>
        <p class="text-lg text-amber-700 mt-2">${gradeMessage}</p>
      </div>

      <div class="bg-gradient-to-br from-yellow-100 via-amber-100 to-orange-100 rounded-2xl p-6 mb-6 border-4 border-amber-600 shadow-xl">
        <h3 class="title-font text-2xl text-amber-900 font-bold mb-4 text-center">🏅 Tu Puntaje Final</h3>
        <div class="text-center">
          <div class="text-7xl title-font text-amber-900 font-bold">${scaledScore.toFixed(1)}</div>
          <div class="text-2xl text-amber-700 font-semibold mt-2">de 5.0 puntos</div>
        </div>
        <div class="grid grid-cols-3 gap-3 mt-6">
          <div class="bg-white rounded-xl p-3 shadow text-center">
            <div class="text-3xl title-font text-green-600 font-bold">${perfectCount}</div>
            <div class="text-xs text-gray-600 font-semibold">Perfectas</div>
            <div class="text-xs text-gray-500">(+1.0 c/u)</div>
          </div>
          <div class="bg-white rounded-xl p-3 shadow text-center">
            <div class="text-3xl title-font text-amber-600 font-bold">${hintCount}</div>
            <div class="text-xs text-gray-600 font-semibold">Con pista</div>
            <div class="text-xs text-gray-500">(+0.75 c/u)</div>
          </div>
          <div class="bg-white rounded-xl p-3 shadow text-center">
            <div class="text-3xl title-font text-blue-600 font-bold">${totalScore.toFixed(1)}</div>
            <div class="text-xs text-gray-600 font-semibold">Puntos brutos</div>
            <div class="text-xs text-gray-500">de ${currentPhases.length}.0</div>
          </div>
        </div>
        <div class="mt-4 bg-amber-50 rounded-xl p-3 border border-amber-300">
          <p class="text-sm text-amber-900 text-center">
            <strong>Fórmula:</strong> (${totalScore.toFixed(2)} ÷ ${currentPhases.length}) × 5 = <strong>${scaledScore.toFixed(1)}</strong>
          </p>
        </div>
      </div>

      <div class="bg-white rounded-2xl p-6 mb-6 border-2 border-gray-200">
        <h3 class="title-font text-xl text-gray-900 font-bold mb-4">📋 Detalle por Pregunta</h3>
        <div class="space-y-2">
          ${currentPhases.map(phase => {
            const ps = phaseScores[phase.id];
            const scoreVal = ps ? ps.score : 0;
            const icon = scoreVal === 1 ? '✅' : (scoreVal === 0.75 ? '⚠️' : '❌');
            const color = scoreVal === 1 ? 'text-green-700' : (scoreVal === 0.75 ? 'text-amber-700' : 'text-red-700');
            const bg = scoreVal === 1 ? 'bg-green-50' : (scoreVal === 0.75 ? 'bg-amber-50' : 'bg-red-50');
            return `
              <div class="flex items-center justify-between p-2 rounded-lg ${bg}">
                <div class="flex items-center gap-2">
                  <span class="text-xl">${icon}</span>
                  <span class="text-sm font-semibold text-gray-800">${phase.icon} ${phase.title} - ${phase.subtitle}</span>
                </div>
                <span class="${color} font-bold">+${scoreVal.toFixed(2)}</span>
              </div>
            `;
          }).join('')}
        </div>
      </div>

      <div class="solution-box rounded-2xl p-6 mb-6">
        <h3 class="title-font text-xl text-blue-900 font-bold mb-3">🎓 Lecciones aprendidas</h3>
        <ul class="list-disc pl-5 space-y-2 text-blue-900">
          <li><strong>Escalado de recetas:</strong> multiplicar cada ingrediente por la misma fracción mantiene las proporciones.</li>
          <li><strong>Simplificación:</strong> reducir fracciones facilita los cálculos.</li>
          <li><strong>Propiedad distributiva:</strong> escalar la suma total o sumar los escalados individuales da el mismo resultado.</li>
          <li><strong>Análisis de negocios:</strong> Ganancia = Ingreso − Costo.</li>
          <li><strong>Sistema de puntaje:</strong> Sin pista = 1.0 punto. Con pista = 0.75 puntos (penalización del 25%).</li>
        </ul>
      </div>

      <div class="text-center">
        <button onclick="generateNewSituation()" class="bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-bold py-4 px-8 rounded-2xl shadow-xl transition transform hover:scale-105 text-lg">
          🎲 Generar nueva situación
        </button>
        <p class="text-sm text-gray-600 mt-3">Se creará un desafío completamente nuevo (plantilla, personaje, postre y fracciones diferentes)</p>
      </div>
    </div>
  `;
  finalSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function generateNewSituation() {
  currentSituation = generateSituation();
  completedPhases.clear();
  phaseScores = {};
  document.getElementById('finalSection').classList.add('hidden');
  document.getElementById('scoreBadge').classList.add('hidden');
  renderSituation();
  renderPhases();
  updateProgress();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============ INIT ============
renderSituation();
renderPhases();
updateProgress();
</script>

</body>
</html>
